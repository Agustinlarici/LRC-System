name: lrc-system-dev

# Rotazione dei log Docker (altrimenti crescono senza limite e riempiono il disco)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    image: postgres:16.15-alpine
    restart: unless-stopped
    command: postgres -c timezone=Europe/Rome
    environment:
      POSTGRES_DB:       lrc_system_dev
      POSTGRES_USER:     lrc
      POSTGRES_PASSWORD: lrc_password
      TZ:                Europe/Rome
    volumes:
      - lrc-system-pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrc -d lrc_system_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Migrazioni DB (one-shot, vedi db/README.md) ──────────────────────────────
  # Applica le migrazioni mancanti e termina. Il backend parte solo se riesce.
  migrate:
    logging: *default-logging
    image: postgres:16.15-alpine
    restart: "no"
    entrypoint: ["bash", "/migrate.sh"]
    environment:
      PGHOST:     db
      PGUSER:     lrc
      PGPASSWORD: lrc_password
      PGDATABASE: lrc_system_dev
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    logging: *default-logging
    image: node:24.20.0-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache samba-client && npm install --no-audit --no-fund && npm run dev"
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      NODE_ENV:            development
      PORT:                3001
      TZ:                  Europe/Rome
      DATABASE_URL:        postgres://lrc:lrc_password@db:5432/lrc_system_dev
      CORS_ORIGINS:        "http://localhost:3000"
      OPENAI_API_KEY:      ${OPENAI_API_KEY:-}
      WEBTHRON_HOST:       ${WEBTHRON_HOST:-192.168.1.12}
      WEBTHRON_PORT:       ${WEBTHRON_PORT:-3306}
      WEBTHRON_DB:         ${WEBTHRON_DB:-WebThron}
      WEBTHRON_USER:       ${WEBTHRON_USER}
      WEBTHRON_PASS:       ${WEBTHRON_PASS}
      WEBTHRON_TZ:         ${WEBTHRON_TZ:-+01:00}
      BC_SERVER:           ${BC_SERVER:-192.168.1.159}
      BC_DATABASE:         ${BC_DATABASE:-STR}
      BC_USER:             ${BC_USER}
      BC_PASSWORD:         ${BC_PASSWORD}
      BC_DOMAIN:           ${BC_DOMAIN:-}
      JWT_SECRET:          ${JWT_SECRET:-dev-secret-change-in-production}
      BUCCI_LOOKBACK_DAYS: ${BUCCI_LOOKBACK_DAYS:-90}
      DELIBERA_FASI:       "DELIBERA FINALE - PROX"
      DELIBERA_ESITO_OK:   "Accettato"
      SPMA_ONEDRIVE_SHARE_URL: ${SPMA_ONEDRIVE_SHARE_URL:-}
      CHOKIDAR_USEPOLLING: "true"
      # SMB credentials vengono da .env.dev via env_file (non sovrascrivere qui)
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src                       # solo fuente → polling detecta cambios
      - ./backend/edi_generators:/app/edi_generators  # generatori EDI (rilevati dinamicamente)
      - ./backend/package.json:/app/package.json
      - ./backend/patches:/app/patches  # patch-package le usa al npm install
      - ./backend/tsconfig.json:/app/tsconfig.json
      - backend_nm:/app/node_modules    # node_modules en volumen interno (rápido)
      - ./backend/node_modules/@marsaud:/app/node_modules/@marsaud:ro  # smb2 parcheado directo
      - ./test-scansioni:/scansioni:ro
      - ./test-documentos:/documentos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    logging: *default-logging
    image: node:24.20.0-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    restart: unless-stopped
    environment:
      BACKEND_URL:          http://backend:3001
      INTERNAL_API_URL:     http://backend:3001
      NEXT_PUBLIC_API_URL:  http://localhost:3001
      WATCHPACK_POLLING:       "true"   # webpack polling (funciona con --no-turbopack)
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src                     # solo fuente
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - frontend_nm:/app/node_modules               # node_modules interno
      - frontend_next:/app/.next                    # .next interno (nunca stale)
    depends_on:
      - backend

  adminer:
    logging: *default-logging
    image: adminer:6.1.2
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lrc-system-pgdata-dev:
    external: true
  backend_nm:
  frontend_nm:
  frontend_next:    # .next vive dentro de Docker, no en Windows
