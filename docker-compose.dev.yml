name: lrc-system-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lrc_system_dev
      POSTGRES_USER:     lrc
      POSTGRES_PASSWORD: lrc_password
    volumes:
      - lrc-system-pgdata-dev:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrate-tickets.sql:/docker-entrypoint-initdb.d/02_tickets.sql:ro
      - ./db/migrate-auth.sql:/docker-entrypoint-initdb.d/03_auth.sql:ro
      - ./db/migrate-tickets-user-profile.sql:/docker-entrypoint-initdb.d/03b_tickets_user_profile.sql:ro
      - ./db/migrate-tickets-approval.sql:/docker-entrypoint-initdb.d/03c_tickets_approval.sql:ro
      - ./db/migrate-tickets-category-edit.sql:/docker-entrypoint-initdb.d/03d_tickets_category_edit.sql:ro
      - ./db/migrate-tickets-created-by.sql:/docker-entrypoint-initdb.d/03e_tickets_created_by.sql:ro
      - ./db/migrate-tickets-priority-backfill.sql:/docker-entrypoint-initdb.d/03f_tickets_priority_backfill.sql:ro
      - ./db/migrate-tickets-resolved-backfill.sql:/docker-entrypoint-initdb.d/03g_tickets_resolved_backfill.sql:ro
      - ./db/migrate-tickets-reopen-backfill.sql:/docker-entrypoint-initdb.d/03h_tickets_reopen_backfill.sql:ro
      - ./db/migrate-heatmap.sql:/docker-entrypoint-initdb.d/04_heatmap.sql:ro
      - ./db/migrate-heatmap-hourly.sql:/docker-entrypoint-initdb.d/05_heatmap_hourly.sql:ro
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/06_migrate.sql:ro
      - ./db/migrate-dashboards.sql:/docker-entrypoint-initdb.d/07_dashboards.sql:ro
      - ./db/migrate-webthron-cache.sql:/docker-entrypoint-initdb.d/08_webthron_cache.sql:ro
      - ./db/migrate-system-config.sql:/docker-entrypoint-initdb.d/09_system_config.sql:ro
      - ./db/migrate-impostazioni.sql:/docker-entrypoint-initdb.d/10_impostazioni.sql:ro
      - ./db/migrate-spma.sql:/docker-entrypoint-initdb.d/11_spma.sql:ro
      - ./db/migrate-spma-import-log.sql:/docker-entrypoint-initdb.d/12_spma_import_log.sql:ro
      - ./db/migrate-lead-time.sql:/docker-entrypoint-initdb.d/13_lead_time.sql:ro
      - ./db/migrate-unified-sync.sql:/docker-entrypoint-initdb.d/14_unified_sync.sql:ro
      - ./db/migrate-iknow-tracking.sql:/docker-entrypoint-initdb.d/15_iknow_tracking.sql:ro
      - ./db/migrate-alerts.sql:/docker-entrypoint-initdb.d/16_alerts.sql:ro
      - ./db/migrate-spma-alerts.sql:/docker-entrypoint-initdb.d/17_spma_alerts.sql:ro
      - ./db/migrate-spma-telegram.sql:/docker-entrypoint-initdb.d/18_spma_telegram.sql:ro
      - ./db/migrate-spma-email.sql:/docker-entrypoint-initdb.d/21_spma_email.sql:ro
      - ./db/migrate-resumen.sql:/docker-entrypoint-initdb.d/19_resumen.sql:ro
      - ./db/migrate-spma-onedrive.sql:/docker-entrypoint-initdb.d/20_spma_onedrive.sql:ro
      - ./db/migrate-monitor-stops.sql:/docker-entrypoint-initdb.d/22_monitor_stops.sql:ro
      - ./db/migrate-edi-ferrari-delins.sql:/docker-entrypoint-initdb.d/23_edi_ferrari_delins.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrc -d lrc_system_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache samba-client && npm install && npm run dev"
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      NODE_ENV:            development
      PORT:                3001
      TZ:                  Europe/Rome
      DATABASE_URL:        postgres://lrc:lrc_password@db:5432/lrc_system_dev
      CORS_ORIGINS:        "http://localhost:3000"
      OPENAI_API_KEY:      ${OPENAI_API_KEY:-}
      WEBTHRON_HOST:       ${WEBTHRON_HOST:-192.168.1.12}
      WEBTHRON_PORT:       ${WEBTHRON_PORT:-3306}
      WEBTHRON_DB:         ${WEBTHRON_DB:-WebThron}
      WEBTHRON_USER:       ${WEBTHRON_USER}
      WEBTHRON_PASS:       ${WEBTHRON_PASS}
      WEBTHRON_TZ:         ${WEBTHRON_TZ:-+01:00}
      BC_SERVER:           ${BC_SERVER:-192.168.1.159}
      BC_DATABASE:         ${BC_DATABASE:-STR}
      BC_USER:             ${BC_USER}
      BC_PASSWORD:         ${BC_PASSWORD}
      JWT_SECRET:          ${JWT_SECRET:-dev-secret-change-in-production}
      DELIBERA_FASI:       "DELIBERA FINALE - PROX"
      DELIBERA_ESITO_OK:   "Accettato"
      SPMA_ONEDRIVE_SHARE_URL: ${SPMA_ONEDRIVE_SHARE_URL:-}
      CHOKIDAR_USEPOLLING: "true"
      # SMB credentials vengono da .env.dev via env_file (non sovrascrivere qui)
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src                       # solo fuente → polling detecta cambios
      - ./backend/edi_generators:/app/edi_generators  # generatori EDI (rilevati dinamicamente)
      - ./backend/package.json:/app/package.json
      - ./backend/patches:/app/patches  # patch-package le usa al npm install
      - ./backend/tsconfig.json:/app/tsconfig.json
      - backend_nm:/app/node_modules    # node_modules en volumen interno (rápido)
      - ./backend/node_modules/@marsaud:/app/node_modules/@marsaud:ro  # smb2 parcheado directo
      - ./test-scansioni:/scansioni:ro
      - ./test-documentos:/documentos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    environment:
      BACKEND_URL:          http://backend:3001
      INTERNAL_API_URL:     http://backend:3001
      NEXT_PUBLIC_API_URL:  http://localhost:3001
      WATCHPACK_POLLING:       "true"   # webpack polling (funciona con --no-turbopack)
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src                     # solo fuente
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - frontend_nm:/app/node_modules               # node_modules interno
      - frontend_next:/app/.next                    # .next interno (nunca stale)
    depends_on:
      - backend

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lrc-system-pgdata-dev:
    external: true
  backend_nm:
  frontend_nm:
  frontend_next:    # .next vive dentro de Docker, no en Windows
