name: lrc-system

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c timezone=Europe/Rome
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lrc_system}
      POSTGRES_USER:     ${POSTGRES_USER:-lrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ:                Europe/Rome
    volumes:
      - lrc-system-pgdata-prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lrc} -d ${POSTGRES_DB:-lrc_system}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Migrazioni DB (one-shot, vedi db/README.md) ──────────────────────────────
  # Applica le migrazioni mancanti e termina. Il backend parte solo se riesce.
  migrate:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["bash", "/migrate.sh"]
    environment:
      PGHOST:     db
      PGUSER:     ${POSTGRES_USER:-lrc}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-lrc_system}
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # ─── Backend (Hono) ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      PORT:           3001
      DATABASE_URL:   postgres://${POSTGRES_USER:-lrc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lrc_system}
      CORS_ORIGINS:   ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Business Central (SQL Server) — article sync at 03:00
      BC_SERVER:      ${BC_SERVER:-}
      BC_DATABASE:    ${BC_DATABASE:-STR}
      BC_USER:        ${BC_USER:-}
      BC_PASSWORD:    ${BC_PASSWORD:-}
      BC_DOMAIN:      ${BC_DOMAIN:-}
      # WebThron (MySQL) — monitor data
      WEBTHRON_HOST:  ${WEBTHRON_HOST:-}
      WEBTHRON_PORT:  ${WEBTHRON_PORT:-3306}
      WEBTHRON_DB:    ${WEBTHRON_DB:-WebThron}
      WEBTHRON_USER:  ${WEBTHRON_USER:-}
      WEBTHRON_PASS:  ${WEBTHRON_PASS:-}
      TZ:             Europe/Rome
      WEBTHRON_TZ:    ${WEBTHRON_TZ:-+01:00}
      # JWT (Ticket IT)
      JWT_SECRET:     ${JWT_SECRET:?JWT_SECRET is required}
      # Delibera qualità
      DELIBERA_FASI:     ${DELIBERA_FASI:-DELIBERA FINALE - PROX}
      DELIBERA_ESITO_OK: ${DELIBERA_ESITO_OK:-Accettato}
      # ─── Ricezione DDT (scanner) ───────────────────────────────────────────
      # ANTHROPIC_API_KEY disabilitato — integrazione Claude sospesa (sicurezza informatica)
      # Per riabilitare: decommentare e impostare il valore nel .env
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Percorsi interni al container (fissi — il bind mount mappa l'host)
      SCAN_FOLDER:  /scansioni
      DOCS_FOLDER:  /documentos
      # ─── Ticket IT — Allegati (percorso interno fisso, bind mount mappa l'host) ─
      UPLOAD_DIR:   /app/uploads
      # SMB / Cartelle di rete (UNC — es. \\192.168.1.245\edi\...)
      SMB_USER:   ${SMB_USER:-}
      SMB_PASS:   ${SMB_PASS:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-}
      # EDI Ferrari DELINS — cartella inbox (default: \\192.168.1.245\edi\FERRARI\DELINS)
      EDI_FERRARI_DELINS_FOLDER: ${EDI_FERRARI_DELINS_FOLDER:-}
      # Optional
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # SPMA — OneDrive folder polling (set to sharing URL to enable)
      SPMA_ONEDRIVE_SHARE_URL: ${SPMA_ONEDRIVE_SHARE_URL:-}
      # ─── Alerting ──────────────────────────────────────────────────────────
      # Telegram disabilitato — integrazione sospesa (sicurezza informatica)
      # Per riabilitare: decommentare le righe e impostare i valori nel .env
      # TELEGRAM_BOT_TOKEN:      ${TELEGRAM_BOT_TOKEN:-}
      # TELEGRAM_CHAT_ID:        ${TELEGRAM_CHAT_ID:-}
      # SPMA_TELEGRAM_BOT_TOKEN: ${SPMA_TELEGRAM_BOT_TOKEN:-}
      # Email (SMTP, opzionale)
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST:      ${SMTP_HOST:-}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}
      SMTP_FROM:      ${SMTP_FROM:-}
    volumes:
      - ${SCAN_FOLDER_HOST:-./test-scansioni}:/scansioni:ro
      - ${DOCS_FOLDER_HOST:-./test-documentos}:/documentos
      - ${TICKETS_UPLOADS_HOST:-./data/tickets-uploads}:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:3001
      BACKEND_URL:      http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ─── nginx (TLS — porte dedicate 3443/3444, SOLO per installazione PWA su tablet) ──
  # L'ufficio continua a usare http://<ip>:3000 come sempre (frontend/backend sopra
  # pubblicano ancora diretti). Queste porte servono solo per chi vuole accedere via
  # HTTPS (richiesto da Chrome per installare la PWA come app sul tablet).
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "3443:3443"
      - "3444:3444"
    depends_on:
      - frontend
      - backend

  # ─── Adminer ────────────────────────────────────────────────────────────────
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lrc-system-pgdata-prod:
    external: true
