name: lrc-system

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lrc_system}
      POSTGRES_USER:     ${POSTGRES_USER:-lrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lrc_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lrc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (Hono) ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:       development
      PORT:           3001
      DATABASE_URL:   postgres://${POSTGRES_USER:-lrc}:${POSTGRES_PASSWORD:-lrc_password}@db:5432/${POSTGRES_DB:-lrc_system}
      CORS_ORIGINS:   http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          action: rebuild

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:3001
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg_data:
