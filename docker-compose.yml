name: lrc-system

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lrc_system}
      POSTGRES_USER:     ${POSTGRES_USER:-lrc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - lrc-system-pgdata-prod:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrate-tickets.sql:/docker-entrypoint-initdb.d/02_tickets.sql:ro
      - ./db/migrate-auth.sql:/docker-entrypoint-initdb.d/03_auth.sql:ro
      - ./db/migrate-heatmap.sql:/docker-entrypoint-initdb.d/04_heatmap.sql:ro
      - ./db/migrate-heatmap-hourly.sql:/docker-entrypoint-initdb.d/05_heatmap_hourly.sql:ro
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/06_migrate.sql:ro
      - ./db/migrate-dashboards.sql:/docker-entrypoint-initdb.d/07_dashboards.sql:ro
      - ./db/migrate-webthron-cache.sql:/docker-entrypoint-initdb.d/08_webthron_cache.sql:ro
      - ./db/migrate-system-config.sql:/docker-entrypoint-initdb.d/09_system_config.sql:ro
      - ./db/migrate-impostazioni.sql:/docker-entrypoint-initdb.d/10_impostazioni.sql:ro
      - ./db/migrate-spma.sql:/docker-entrypoint-initdb.d/11_spma.sql:ro
      - ./db/migrate-spma-import-log.sql:/docker-entrypoint-initdb.d/12_spma_import_log.sql:ro
      - ./db/migrate-lead-time.sql:/docker-entrypoint-initdb.d/13_lead_time.sql:ro
      - ./db/migrate-unified-sync.sql:/docker-entrypoint-initdb.d/14_unified_sync.sql:ro
      - ./db/migrate-iknow-tracking.sql:/docker-entrypoint-initdb.d/15_iknow_tracking.sql:ro
      - ./db/migrate-alerts.sql:/docker-entrypoint-initdb.d/16_alerts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lrc} -d ${POSTGRES_DB:-lrc_system}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (Hono) ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      PORT:           3001
      DATABASE_URL:   postgres://${POSTGRES_USER:-lrc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lrc_system}
      CORS_ORIGINS:   ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Business Central (SQL Server) — article sync at 03:00
      BC_SERVER:      ${BC_SERVER:-}
      BC_DATABASE:    ${BC_DATABASE:-STR}
      BC_USER:        ${BC_USER:-}
      BC_PASSWORD:    ${BC_PASSWORD:-}
      # WebThron (MySQL) — monitor data
      WEBTHRON_HOST:  ${WEBTHRON_HOST:-}
      WEBTHRON_PORT:  ${WEBTHRON_PORT:-3306}
      WEBTHRON_DB:    ${WEBTHRON_DB:-WebThron}
      WEBTHRON_USER:  ${WEBTHRON_USER:-}
      WEBTHRON_PASS:  ${WEBTHRON_PASS:-}
      TZ:             Europe/Rome
      WEBTHRON_TZ:    ${WEBTHRON_TZ:-+01:00}
      # JWT (Ticket IT)
      JWT_SECRET:     ${JWT_SECRET:?JWT_SECRET is required}
      # Delibera qualità
      DELIBERA_FASI:     ${DELIBERA_FASI:-DELIBERA FINALE - PROX}
      DELIBERA_ESITO_OK: ${DELIBERA_ESITO_OK:-Accettato}
      # Optional
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ─── Alerting ──────────────────────────────────────────────────────────
      # Telegram Bot (crea bot con @BotFather → ottieni TOKEN e CHAT_ID)
      TELEGRAM_BOT_TOKEN:      ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID:        ${TELEGRAM_CHAT_ID:-}
      SPMA_TELEGRAM_BOT_TOKEN: ${SPMA_TELEGRAM_BOT_TOKEN:-}
      # Email (SMTP, opzionale)
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_HOST:      ${SMTP_HOST:-}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}
      SMTP_FROM:      ${SMTP_FROM:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://backend:3001
      BACKEND_URL:      http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ─── Adminer ────────────────────────────────────────────────────────────────
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lrc-system-pgdata-prod:
    external: true
