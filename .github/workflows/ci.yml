name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  backend:
    name: Backend — type-check & lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  frontend:
    name: Frontend — type-check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint

  scripts:
    name: Script shell — shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/backup/*.sh scripts/monitor/*.sh deploy.sh
      - name: docker compose config
        run: |
          touch .env.dev
          POSTGRES_PASSWORD=x CORS_ORIGINS=x JWT_SECRET=x NEXT_PUBLIC_API_URL=x docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q

  migrations:
    name: Database — migrazioni (DB vuoto, idempotenza, rollback, legacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # il test 7 legge i file del vecchio sistema dalla storia git
      - run: shellcheck -S warning db/migrate.sh db/test-migrations.sh db/check-drift.sh
      - run: db/test-migrations.sh
